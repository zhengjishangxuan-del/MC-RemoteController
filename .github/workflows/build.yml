name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List root files
      run: |
        echo "=== Root files ==="
        ls -la
        echo "=== Xcode version ==="
        xcodebuild -version

    - name: Setup project structure
      run: |
        mkdir -p iOSClient/MCRemoteClient.xcodeproj
        mkdir -p iOSClient/MCRemoteClient/Assets.xcassets/AppIcon.appiconset
        mkdir -p iOSClient/MCRemoteClient/Base.lproj
        mv AppDelegate.swift iOSClient/MCRemoteClient/ 2>/dev/null || true
        mv ConnectViewController.swift iOSClient/MCRemoteClient/ 2>/dev/null || true
        mv MainViewController.swift iOSClient/MCRemoteClient/ 2>/dev/null || true
        mv UdpClient.swift iOSClient/MCRemoteClient/ 2>/dev/null || true
        mv Info.plist iOSClient/MCRemoteClient/ 2>/dev/null || true
        mv LaunchScreen.storyboard iOSClient/MCRemoteClient/Base.lproj/ 2>/dev/null || true
        mv Contents.json iOSClient/MCRemoteClient/Assets.xcassets/ 2>/dev/null || true
        printf '{\n  \"images\" : [\n    {\n      \"idiom\" : \"universal\",\n      \"platform\" : \"ios\",\n      \"size\" : \"1024x1024\"\n    }\n  ],\n  \"info\" : {\n    \"author\" : \"xcode\",\n    \"version\" : 1\n  }\n}\n' > iOSClient/MCRemoteClient/Assets.xcassets/AppIcon.appiconset/Contents.json
        mv project.pbxproj iOSClient/MCRemoteClient.xcodeproj/ 2>/dev/null || true
        echo "=== Project structure ==="
        find iOSClient -type f

    - name: List Xcode targets
      run: |
        cd iOSClient
        echo "=== xcodebuild -list ==="
        xcodebuild -list -project MCRemoteClient.xcodeproj || true

    - name: Build iOS app (unsigned)
      run: |
        cd iOSClient
        xcodebuild -project MCRemoteClient.xcodeproj \
          -target MCRemoteClient \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build 2>&1 | tail -50

    - name: Find app and create IPA
      run: |
        cd iOSClient
        echo "=== Find .app files ==="
        find . -type d -name "*.app" 2>/dev/null
        echo "=== Build tree ==="
        find build -maxdepth 4 -type d 2>/dev/null | head -30
        APP_PATH=$(find . -type d -name "*.app" | head -1)
        echo "APP_PATH: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: .app not found!"
          find . -maxdepth 6 -type d
          exit 1
        fi
        ls -la "$APP_PATH"
        rm -rf Payload
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        rm -f MCRemoteClient.ipa
        zip -r MCRemoteClient.ipa Payload
        ls -la MCRemoteClient.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MCRemoteClient-IPA
        path: iOSClient/MCRemoteClient.ipa
        if-no-files-found: error
